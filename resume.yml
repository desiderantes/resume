summary: "Senior Backend Architect & Modernization Specialist with 10+ years of experience leading high-stakes digital transformations for enterprise clients including Modern Campus, IPSY, NFL, and Nordstrom. Expert in JVM ecosystem evolution (Java 8-25, Kotlin, Scala, Spring Boot 3+), specializing in zero-downtime data migrations, developer productivity tooling, and large-scale refactoring automation using Gradle and OpenRewrite. Proven track record in orchestrating multi-team modernization initiatives and building resilient, observable backend platforms supporting 2M+ concurrent users. Passionate about technical strategy, dependency governance, and platform engineering."
