      - Wrote a custom verification script in Kotlin to aid in post-migration checks.
      - Liberate data from MySQL 5.6 written in compressed Protobuf fields to Kafka topics with schema info readily available, by relying on CDC with Debezium and a custom stream processor written in Java 11 with Spring Boot, Kafka, configured with HOCON, and deserializing Protobufs on the fly with Reflection.
      - Implement an accounts linking service that allows debtors to get their debts into a single consumer profile for payment purposes. The service uses Kafka, Spring Boot, Spring Cloud Streams, PostgreSQL 13, and a series of Kafka Connect connectors to stream the liberated data to be processed as it comes.
