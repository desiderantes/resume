projects:
  - name: IPSY Inc.
    url: "https://ipsy.com/"
    affiliation: Nexton
    startDate: 2022-11-01
    endDate: 2023-03-18
    highlights:
      - Led a migration of services from Java 8 to Java 21, introducing widespread changes like migrating to Spring Boot 3; creating a DSL for cache configuration on Caffeine vía YAML; adding Record support for our internal parser libraries; rewriting our internal Gradle build to Gradle 8.12, Kotlin, and Version Catalogs; introduced Testcontainers for integration tests; among other changes
      - Designed a simple all-or-nothing migration system for user data on a company merge, with Scala scripts on Databricks using Apache Spark, PostgreSQL, and custom parse code for serialized PHP objects from Magento. This allowed us to migrate users in a lockstep, ensuring no intermediate statuses for migrations and no data loss.
  - name: TrueAccord
