name: Build Resume

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      embed_yml:
        description: "Embed resume.yml in the PDF and enable clickable links (leave as none to use the meson default)"
        required: false
        type: choice
        default: "none"
        options:
          - "none"
          - "true"
          - "false"
      embed_diploma:
        description: "Embed diploma.pdf in the PDF (leave as none to use the meson default)"
        required: false
        type: choice
        default: "none"
        options:
          - "none"
          - "true"
          - "false"
      embed_certs:
        description: "Embed certificates in the PDF (leave as none to use the meson default)"
        required: false
        type: choice
        default: "none"
        options:
          - "none"
          - "true"
          - "false"
      pdf_standard:
        description: "PDF standard to enforce conformance with (leave as none to use the meson default)"
        required: false
        type: choice
        default: "none"
        options:
          - "none"
          - "1.7"
          - "2.0"
          - "a-1b"
          - "a-1a"
          - "a-2b"
          - "a-2u"
          - "a-2a"
          - "a-3b"
          - "a-3u"
          - "a-3a"
          - "a-4"
          - "a-4f"
          - "a-4e"
          - "ua-1"

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build qpdf jq pandoc fonts-inter fonts-ibm-plex fontconfig

      - name: Install Typst
        run: |
          TYPST_VERSION=$(curl -s https://api.github.com/repos/typst/typst/releases/latest | jq -r .tag_name)
          curl -L "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o typst.tar.xz
          tar -xvf typst.tar.xz
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
          typst --version

      - name: Configure build
        run: |
          OPTS=()
          [ "${{ github.event.inputs.embed_yml }}" != "none" ] && [ -n "${{ github.event.inputs.embed_yml }}" ] && OPTS+=("-Dembed_yml=${{ github.event.inputs.embed_yml }}")
          [ "${{ github.event.inputs.embed_diploma }}" != "none" ] && [ -n "${{ github.event.inputs.embed_diploma }}" ] && OPTS+=("-Dembed_diploma=${{ github.event.inputs.embed_diploma }}")
          [ "${{ github.event.inputs.embed_certs }}" != "none" ] && [ -n "${{ github.event.inputs.embed_certs }}" ] && OPTS+=("-Dembed_certs=${{ github.event.inputs.embed_certs }}")
          [ "${{ github.event.inputs.pdf_standard }}" != "none" ] && [ -n "${{ github.event.inputs.pdf_standard }}" ] && OPTS+=("-Dpdf_standard=${{ github.event.inputs.pdf_standard }}")
          meson setup build "${OPTS[@]}"

      - name: Build project
        run: meson compile -C build

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Prepare artifact
        run: |
          cp build/resume.pdf "resume-${{ steps.date.outputs.date }}.pdf"
          cp build/resume.html "resume-${{ steps.date.outputs.date }}.html"
          cp build/resume.md "resume-${{ steps.date.outputs.date }}.md"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf-${{ steps.date.outputs.date }}
          path: resume-${{ steps.date.outputs.date }}.pdf

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-html-${{ steps.date.outputs.date }}
          path: resume-${{ steps.date.outputs.date }}.html

      - name: Create Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && !contains(github.event.head_commit.message, 'WIP')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: Release ${{ steps.date.outputs.date }}
          files: |
            resume-${{ steps.date.outputs.date }}.pdf
            resume-${{ steps.date.outputs.date }}.html
            resume-${{ steps.date.outputs.date }}.md
